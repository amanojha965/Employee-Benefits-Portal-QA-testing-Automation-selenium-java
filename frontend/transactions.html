<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions — Employee Benefits Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo-mark">EB</div>
      <span>Benefits Portal</span>
    </div>
    <ul class="nav-menu">
      <li><a href="dashboard.html" id="navDashboard">Dashboard</a></li>
      <li><a href="benefits.html" id="navBenefits">Benefits</a></li>
      <li><a href="rewards.html" id="navRewards">Rewards</a></li>
      <li><a href="transactions.html" id="navTransactions" class="active">Transactions</a></li>
    </ul>
    <div class="sidebar-footer">
      <button id="navLogout" class="logout-btn">Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h2>Transactions</h2>
      <p>A record of every benefit and reward you've redeemed.</p>
    </div>

    <div class="filters-row">
      <input type="text" id="searchTransaction" placeholder="Search transactions by name...">
    </div>

    <table class="data-table" id="transactionsTable">
      <thead>
        <tr>
          <th>Transaction</th>
          <th>Type</th>
          <th>Points</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="transactionsBody">
      </tbody>
    </table>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/transactions.js"></script>
</body>
</html>
